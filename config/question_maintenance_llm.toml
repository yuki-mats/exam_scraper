version = 2

[limits]
question_parallelism = 100
llm_call_concurrency = 100
audit_batch_questions = 5
audit_batch_input_bytes = 120000

[backends.codex_app_server]
kind = "codex_app_server"

[backends.openai_compatible_http]
kind = "openai_compatible_http"
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = "qwen3:14b"
retry_model = "qwen3:14b"
timeout_seconds = 600

[profiles.codex_only]
operational = true

[profiles.codex_only.roles.maintenance]
backend = "codex_app_server"

[profiles.codex_only.roles.audit]
backend = "codex_app_server"

[profiles.local_generate_codex_audit]
operational = false

[profiles.local_generate_codex_audit.roles.maintenance]
backend = "openai_compatible_http"

[profiles.local_generate_codex_audit.roles.audit]
backend = "codex_app_server"
