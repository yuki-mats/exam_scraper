  slug: "question-maintenance-hold-convergence"
  kind: existing_plan
  tranche: "停止工程再開、決定的な集約抽出、入力不足の事前振分けを既存一問queueへ統合する"
  status: done
  oracle:
    signal: "代表715問のpreview作業数、入力不足のmodel turn数、集約抽出fixture、品質gate、00_source不変"
    cadence: "after each Worker package and at final audit"
    final_proof: "全task receipt、対象・全体回帰、代表preview/run readback、origin/main反映、full_outcome_complete: true"
  intake:
    original_request: "複雑化しないようにあるべき姿にシンプルなリファクタリングと改善を実施する"
    interpreted_outcome: "既存の一問queueを単純化し、解消可能な保留だけを正しい工程から再実行する"
    input_shape: existing_plan
    audience: "問題整備システムの運用者と受験者"
    authority: approved
    proof_type: metric
    completion_proof: "不要な前工程1,343件が代表previewから消え、入力不足は生成前停止し、全角小文字の集約問題を原文spanから抽出できる"
    likely_misfire: "新しいqueueや例外条件を増やす、品質gateを弱める、又は同じ入力を再生成して保留を見かけ上減らす"
    blind_spots_considered:
      - "旧run readbackとresume互換"
      - "工程版又は入力変更時の再実行"
      - "画像・法令根拠の取得所有者"
      - "集約reviewのfail-closed境界"
      - "既存未コミット成果物との分離"
    existing_plan_facts:
      - "問題ごとの最初の停止工程から再整備する"
      - "画像・本文・試験時法令不足はLLM前に止める"
      - "全角小文字ａ．〜ｄ．を機械抽出する"
      - "02aで02の不整合を発見したら自動補正せず所有工程へ戻す"
      - "各改善を検証、commit、origin/main pushまで閉じる"
      - "ユーザー指示により、以後はサブエージェントを起動せずPMが直接調査・実装・検証する"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

