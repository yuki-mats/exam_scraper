      - "current workflow catalog, queue, blocked-rework, aggregate decomposition and validation code"
      - "document/operations/exam_pipeline_manual_and_automation.md"
    constraints:
      - "Read-only."
      - "Reuse the existing queue and stage ordering."
      - "Reject special-case fixes based only on Japanese error text."
      - "Do not weaken hold or quality gates."
    expected_output:
