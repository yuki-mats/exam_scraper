version: 2

goal:
  title: "問題整備システムの全体最適化"
  slug: "question-maintenance-system-optimization"
  kind: existing_plan
  tranche: "continuous execution: 優先改善を一つずつ実装・検証・commit・pushし、実測に基づいて次の改善へ進む"
  status: active
  oracle:
    signal: "各改善の独立commit、対象テスト、関連回帰、00_source不変検査、成果物又はUI readbackが揃う"
    cadence: "after each Worker package and at final audit"
    final_proof: "全改善receipt、最終回帰、代表run readback、origin/main反映、条件付き改善の実施又は不採用根拠"
  intake:
    original_request: "全体最適化になるように一つずつ改善し、各結果が正しいか検証しながら一つずつ修正する"
    interpreted_outcome: "既存の安全な一問完結型を維持し、実測可能性、候補契約、評価確定境界、公開操作を独立sliceで改善する"
    input_shape: existing_plan
    audience: "問題整備システムの運用者と受験者"
    authority: approved
    proof_type: metric
    completion_proof: "優先改善が独立commitとしてorigin/mainへ反映され、最終回帰と代表readbackが通る"
    likely_misfire: "100並列を再実装する、旧runへ個別条件を足す、又は複数改善を一括変更して効果を判別不能にする"
    blind_spots_considered:
      - "予約future数と実際のmodel turn並列度は異なる"
      - "旧run失敗は後続修正後の現行欠陥とは限らない"
      - "candidate形式変更にはresume互換が必要"
      - "評価失敗が最新の有効結果を上書きし得る"
      - "公開の壁時計にはUI操作待ちが含まれる"
      - "state書込が実ボトルネックかは未計測"
    existing_plan_facts:
      - "第一改善は実turn並列度、queue wait、refill latency、writer waitの永続化"
      - "第二改善は型付きcandidate DTOとserver-owned fieldの分離"
      - "第三改善は未完成評価から最新有効評価を守るserver側防御"
      - "第四改善は確認対象を固定する明示選択式の直列公開queue"
      - "state v3とUI/worker分離は計測で必要性が示された場合だけ実施"
      - "同一thread補完評価、複数問model batch、Firestore並列writer、1問1patchは不採用"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/question-maintenance-system-optimization/"
    command: "node /Users/yuki/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/question-maintenance-system-optimization"

