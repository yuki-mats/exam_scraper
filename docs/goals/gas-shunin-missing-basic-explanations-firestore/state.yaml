  slug: "gas-shunin-missing-basic-explanations-firestore"
  kind: specific
  tranche: "Firestoreの余分647問を復旧可能に非表示化し、問題セット・フォルダ件数をライブ実数へ収束させる"
  status: active
  oracle:
    signal: "甲種・乙種のFirestoreライブ読取で表示対象のexplanationText欠落件数が0"
