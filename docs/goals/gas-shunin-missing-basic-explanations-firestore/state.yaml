    original_request: "isDeleted=falseかつisChoiceOnly=falseの問題の基本解説を一問ずつ作成し、Firestoreへアップして更新する"
    interpreted_outcome: "表示対象の基本解説欠落を全件解消し、ローカル正本とFirestoreを一致させる"
    input_shape: specific
    audience: "ガス主任技術者試験の受験者"
    authority: requested
    proof_type: metric
    completion_proof: "Firestoreライブ欠落0件、全更新対象readback一致、品質検査合格"
    likely_misfire: "qualificationIdだけで絞って旧ID混在分を落とす、直接Firestoreだけを更新する、又は一問ごとの根拠なしに汎用解説を一括生成する"
    blind_spots_considered:
      - "旧qualificationIdと現行甲乙フォルダ所属の混在"
      - "isChoiceOnly=trueは契約上explanationTextを持たない"
      - "法令問題の現行法根拠と出題当時の正誤を混同しない"
      - "実行中jobとqualification lockを破壊しない"
      - "mainがorigin/mainより56コミット先行しており、push範囲の所有確認が必要"
    existing_plan_facts:
      - "一問ずつ基本解説を作成する"
      - "同じ論点・出題形式の既存類題解説を踏まえて内容と粒度を揃える"
      - "Firestoreへアップし、更新後を確認する"
      - "サブエージェントを使わずPMスレッドだけで実行する"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
