  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "全receiptとlive readbackをoracleへ対応付け、CLF-C02全件が問題整備システム経由でupload dry-runまで完了したか最終監査する。"
    inputs:
