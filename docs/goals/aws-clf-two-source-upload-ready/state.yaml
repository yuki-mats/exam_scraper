    input_shape: recovery
    audience: "AWS Certified Cloud Practitionerを学習する受験者"
    authority: requested
    proof_type: artifact
    completion_proof: "全対象の終端run、公開前artifact、quality gate、upload dry-run、Firestore非書込、00_source不変のreceiptが一致する。"
    likely_misfire: "問題整備システムを迂回する、03だけで完了扱いする、片方の取得元だけ処理する、fastモードを理由に検証を省略する、又はFirestoreへ書く。"
    blind_spots_considered:
      - "既存runとrepository lock"
      - "前回03成果物の現行性"
      - "両取得元と全対象件数"
      - "04分類と独自画像gate"
      - "hold・pendingの再開"
      - "artifact syncと公開版互換"
      - "Firestore書き込み境界"
    existing_plan_facts:
      - "現在ローカルにあるCLF-C02全件を対象にする。"
      - "問題整備システム経由だけで実行する。"
      - "fastモードで最速化する。"
      - "Firestore反映直前のupload-ready・dry-runまでで止める。"
      - "既存のAWS 03整備goalは完了済みだが、現行状態を再確認する。"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

