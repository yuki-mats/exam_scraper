      - "terminal manifests and progress"
      - "upload-ready and dry-run receipts"
      - "Firestore write evidence"
      - "00_source hash and Git readback"
    constraints:
      - "Do not implement。"
      - "片方の取得元、単一工程、又は一部問題だけの成功を完了扱いしない。"
      - "blocking、hold、pending、未検証artifactがあればrejectする。"
      - "Firestore writeがあればscope違反としてrejectする。"
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "oracle evidence map"
      - "missing evidence"
      - "next task if not complete"
    receipt: null

