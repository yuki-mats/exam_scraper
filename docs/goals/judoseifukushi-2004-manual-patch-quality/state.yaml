version: 2

goal:
  title: "柔道整復師 2004年 目視整備 patch 品質向上"
  slug: "judoseifukushi-2004-manual-patch-quality"
  kind: existing_plan
  tranche: "judoseifukushi / 2004年 の全200問を一問ずつ目視で精査・整備する。"
  status: in_progress
  oracle:
    signal: "対象200問について正しい回答・意図・専門家水準の解説品質が確認され、patch更新、coverage check、不変性検査に通っている。"
    cadence: "各ファイル（約25問）完了後および最終監査時"
    final_proof: "全8ファイル（200問）のpatch成果物、検証コマンド結果、最終監査記録。"
  intake:
    original_request: "2010年から2006年まで、順次、目視精査とパッチ整備してください。必ず１問ずつ目視で整備を丁寧に実施してほしい。"
    interpreted_outcome: "2004年の全200問を棚卸し一覧化し、1問ずつ目視確認しながら最新基準（形式10・意図15・正答23・解説21）で高品質に整備を完遂する。"
    input_shape: existing_plan
    audience: "柔道整復師国家試験の受験者と運用者"
    authority: requested
    proof_type: artifact
    completion_proof: "全200問が目視処理され、coverage checkを全件通過し、mainブランチに直接コミット・プッシュされること。"
    likely_misfire: "スクリプトによる一括自動置換、検証スクリプトのみでの形骸的完了。"
    blind_spots_considered:
      - "断片肢の否定設問におけるquestionIntentの統一適用（select_correct）"
      - "文化庁基準に基づく文頭結論（正しい。/間違い。）および自然な主語（法令名を主語にしない）"
      - "関係法規設問における正確な条文・制度根拠の紐付け"
      - "複数正答問題（flash_card）の正しい形式（正解・間違いの明記、空のlawReferences）"
    existing_plan_facts:
      - "会話・報告は日本語で行う。"
      - "変更時には作業内容と保存先を明示する。"
      - "スクリプトによる一括機械生成は禁止。既存ツールのみ活用。"
      - "1問ずつ問題文・全選択肢・公式解答を目視確認する。"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

