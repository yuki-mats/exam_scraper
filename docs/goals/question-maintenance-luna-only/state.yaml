          status: pass
        - cmd: "python3 -m unittest tests.test_question_review_qualification_runs.QualificationQueueSafetyRegressionTests.test_failed_question_retries_after_normal_queue_is_drained tests.test_question_review_qualification_runs.QualificationQueueSafetyRegressionTests.test_resumed_fresh_and_failed_questions_use_separate_models"
          status: pass
        - cmd: "python3 -m unittest tests.test_question_review_qualification_runs"
          status: pass
        - cmd: "pytest model backend and hybrid suites from isolated cwd"
          status: pass
