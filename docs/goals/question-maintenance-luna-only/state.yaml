  slug: "question-maintenance-luna-only"
  kind: specific
  tranche: "Luna以外への自動昇格を除去し、回帰検証する"
  status: done
  oracle:
    signal: "初回・再試行・reviewのmodelがLunaだけで、関連テストが通る"
    cadence: "after implementation and final audit"
    final_proof: "model allowlist、再試行履歴、公開status、1並列設定、正本文書及びテスト結果"
  intake:
    original_request: "ローカルLLMではなく、Luna以下で応答性能と品質を満たすコスト効率の良い構成にする"
    interpreted_outcome: "運用をGPT-5.6 Luna単一モデルに固定し、上位Solへのretry昇格をなくす"
    input_shape: specific
    audience: "問題整備システムの運用者"
    authority: approved
    proof_type: test
    completion_proof: "Luna以外が運用model allowlistと再試行経路に存在せず、関連回帰テストが通る"
    likely_misfire: "Luna初回のままSol retryを残す、又は同一model reviewを異種model監査と誤認する"
    blind_spots_considered:
      - "既存benchmarkの画像未入力と監査scorer不備により、品質証明を過大評価できない"
      - "5.4 Miniは公式API単価がLunaより高く、単純なコスト低下候補ではない"
      - "ローカルprofileは既にoperational=falseで通常UIに出ない"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/question-maintenance-luna-only/"
