      summary: "初回・再試行・reviewの運用model allowlistをGPT-5.6 Lunaだけへ限定し、Solへの自動昇格を除去した。ローカル実験profileはoperational=falseのまま維持した。"

  - id: T002
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: "現在diffと検証結果を監査し、Luna単一モデル化が元の依頼を満たすか判定する。"
    inputs:
      - "T001 receipt"
      - "Current git diff and verification"
      - "Existing fixed-set Luna baseline telemetry"
    constraints:
      - "Read-only。ただしstate.yamlの最終receipt更新はPM control workとして許可する。"
      - "既存benchmarkの画像未入力及びscorer不備を品質合格へ読み替えない。"
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "remaining quality caveats"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      rationale: "運用allowlist、初回、再試行及びworkflow reviewはLunaだけになり、Solへの自動昇格はない。1並列、profile routing及び安全境界の関連回帰テストも通った。"
      evidence:
        - "QUESTION_MAINTENANCE_MODELとQUESTION_MAINTENANCE_RETRY_MODELはいずれもgpt-5.6-luna。"
        - "QUESTION_MAINTENANCE_MODELSとAGENT_POLICY_MODELSはgpt-5.6-lunaの単一要素。"
        - "327 unique related tests passed: App Server/workflow 95、qualification 185、backend/hybrid 47。retry 2件はqualification全体に加えて個別にも再実行した。"
        - "既存固定集合のLuna baselineは34問を7 call、329.35秒で処理し、LLM呼出しpeakは1。"
        - "ローカルprofileはoperational=falseで通常運用へ出ない。"
      caveats:
        - "固定集合のraw oracleは画像未入力5問を含む27/34で、画像を除くテキストは27/29。既存audited 34/34はscorer不備のため品質根拠に使わない。"
        - "同じLunaの別session reviewは異種model監査ではない。公開品質は機械検査、hold、人間確認を含む既存gateで守る。"
      summary: "Luna以下という上限を守り、より高価な5.4 Miniや上位Solへ切り替えない最小のLuna単一構成として完了した。"
