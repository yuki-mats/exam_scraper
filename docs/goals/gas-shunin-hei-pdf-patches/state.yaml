        - scripts/merge/00_merge_all.py:567-601
        - tests/test_official_source_correction.py
        - tests/test_question_issue_correction_patch.py
      facts:
        - 新規01はquestionType/isCalculationQuestion、02はquestionIntent、02aは厳密正答だけを所有する。10へ本文を入れるのはlegacy読取互換であり今回の新規訂正の正式責務ではない。05は公式過去問に使用しない。
        - 24はschemaVersion=question-issue-correction/v1、origin=user_problem_report。UI公式資料訂正も同じ既存形式を使い、ui-official由来のcaseを生成する。前回照合結果をそのままblindReviewHashesと偽装できない。
        - 24のquestion_contentカテゴリはquestionBodyTextとchoiceTextListだけ、imageカテゴリはquestionImageStorageUrls/originalQuestionChoiceImageUrls/explanationImageUrlsだけを許可する。
        - sourceQuestionKey・reviewQuestionId・sourceRecordRefの三要素を00_source inventoryのexact-oneへ解決し、expectedBeforeHashで内容driftを拒否する。自然source
          IDだけの曖昧な束縛を避けられる。
        - OfficialSourceCorrectionService.run(question, state_hash, category, evidence_path,
          evidence_title, evidence_locator, verified_transcription, emit, resume_work_directory='')
          が既存保存API。server入口はPOST /api/official-source-corrections/start。server-owned
          projected recordがあればmergedディレクトリ不在でも動くテストがある。
        - 同serviceは実AppServerの独立Blind A/B/Challengeと実画像送信bytes/hashを検証し、全変更一致・選択根拠一致・patch検証後だけ24へ移す。修正対象は1問ごと。
        - 通常物理mergeとlogical projectionは同じ24 readerを使用する。24は30_merged_2側で適用され、20_merged_1には適用されない。
        - CLIはpython3 scripts/merge/00_merge_all.py <年度> --base-dir output/gas-shunin-hei/questions_json。--source-bindings
          <identity三要素JSON>で原問を限定可能。ただし限定生成で既存全体出力を置き換えないよう保存先・既存生成物の確認が必要。
        - 25_verified_publicationの専用再生成QUALIFICATIONSはgas-shunin-kou/gas-shunin-otsuだけ。丙種に25を新規手書きするのは契約外。丙種現状2017は00_source3ファイルのみ。
        - 対象検証候補はtests.test_official_source_correction、tests.test_question_issue_correction_patch、patch
          checker、通常merge、その後AGENTS必須のchoice alignment/required fields/correct-choice
          coverageの3checker。未整備sourceしかないためschema不足を訂正成功と混同しない。
      contradictions:
