        A/B/Challengeを固定して保存します。丙種は甲乙専用25移行経路の対象外です。70問だけでなく科目共通注を各問へ保持する場合は適用範囲全件が訂正対象になります。画像serviceはStorageへ実公開するため、ローカルpatchのみの今回には境界判断が必要です。
      evidence:
        - document/operations/artifact_contract.md:55-73
        - document/operations/question_issue_report_workflow.md:119-158
        - config/question_issue_reports.json:15-26,104-124
        - scripts/merge/question_issue_corrections.py:20-55,179-210
        - scripts/merge/record_projection.py:365-405
        - tools/question_review_console/official_source_correction.py:481-560,679-810
        - tools/question_review_console/server.py:1137-1155,2648-2675
