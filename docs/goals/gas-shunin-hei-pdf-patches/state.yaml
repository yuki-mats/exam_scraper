version: 2
goal:
  title: 丙種70問と共通注を公式PDFに基づいてパッチ修正
  slug: gas-shunin-hei-pdf-patches
  kind: specific
  tranche: 70問の個別指摘解消・全9年度共通注補完・source不変・ローカル検証・commit/push
  status: active
  oracle:
    signal: 通常mergeで70問の修正と全共通注が反映され全source/IDが不変
    cadence: 年度別と最終監査
    final_proof: 一問別公式画像確認receipt、patch適用差分、3必須checker成功、main push
  intake:
    original_request: 要確認70問を公式PDFに基づいて1問ずつ修正し共通注を補完、00_source保持、パッチ層対応
    interpreted_outcome: 70問の個別指摘解消・全9年度共通注補完・source不変・ローカル検証・commit/push
    input_shape: specific
    audience: 丙種学習者
    authority: approved
    proof_type: artifact
    completion_proof: 一問別公式画像確認receipt、patch適用差分、3必須checker成功、main push
    likely_misfire: 元の70件だけに注を追加して共通条件が他問から欠落する、rawHTML図だけ修正しJSONを変えない
    blind_spots_considered:
      - 全科目の注適用範囲
      - 図の本文への正しい結合
      - サイト独自解説の認証へ広げない
    existing_plan_facts:
      - 00_source不変
      - 公式PDF根拠
      - 一問ずつ目視
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
