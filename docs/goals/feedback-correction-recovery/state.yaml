version: 2
goal:
  title: 問題報告の正式訂正と公開工程を復旧する
  slug: feedback-correction-recovery
  kind: recovery
  tranche: 確認済み4件の正本patch・独立review・限定公開検証・台帳追跡を復旧する
  status: active
  oracle:
    signal: 一次根拠、全カテゴリ判断、source identity、真正なreview、機械gate、台帳状態、承認済み公開対象のlive readbackが一致
    cadence: after each Worker package and at final audit
    final_proof: 各対象の根拠付き処理結果、検証済み正式patchとcommit/push、承認及びlive readback
  intake:
    original_request: /goalあるべき姿にして
    interpreted_outcome: 前回未完了の4件を正本patchから公開まで追跡可能にする
    input_shape: recovery
    audience: Repaso利用者と運用者
    authority: requested
    proof_type: artifact
    completion_proof: 正式patchとreadbackと台帳、又は一次根拠付き保留と再開条件
    likely_misfire: 隔離simulationで完了扱い又は安全gateの迂回
    blind_spots_considered:
      - 歴史的mergedと現行sourceの差
      - 年度全体gateと一問gateの混同
      - patch承認と公開判断の混同
    existing_plan_facts:
      - 2025年学科II問3の具体的差分は承認済み
      - 本番公開は別明示判断を要する
      - 4件のprivate提案とcase記録を引き継ぐ
      - 常設UIの既存goalは別scopeで維持する
      - 2026-10-03 user explicitly approved questionIntent null→select_correct; correct_answer vector and questionIntent approved, Firestore unapproved
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: installed
  worker: installed
  judge: installed
