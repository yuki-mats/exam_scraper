version: 2

goal:
  title: "問題整備の下位クラウドモデル比較"
  slug: "question-maintenance-lower-cloud-model-benchmark"
  kind: specific
  tranche: "各下位候補を固定集合で実利用し、Sol監査込みの品質とコスト効率で採否を閉じる"
  status: done
  oracle:
    signal: "各候補の実model call、raw品質、Sol監査品質、重大誤り、schema安定性、時間、call・usageの比較表"
    cadence: "after each model screen and at final audit"
    final_proof: "availability証拠、blind input、sealed prompt capture、oracle-after-run、比較結果、安全確認、最終model決定"
  intake:
    original_request: "Lunaより低いモデルについてもそれぞれ利用してみて、問題ないか確認して、コスパの良いモデルを見つけたい"
    interpreted_outcome: "GPT-5.4、GPT-5.4 Mini、GPT-5.3 Codex Sparkを実測し、Sol監査込みでLunaより良い作業modelがあるか決定する"
    input_shape: specific
    audience: "問題整備システムの運用者と受験者"
    authority: approved
    proof_type: metric
    completion_proof: "全候補を同条件で実利用し、品質合格候補のうち最もコスト効率が良いmodel又はLuna維持を決定する"
    likely_misfire: "画面の上下順又はAPI単価だけでmodelを選び、実品質とschema失敗を測らない"
    blind_spots_considered:
      - "GPT-5.4はLunaより公式API単価が高い"
      - "Sparkは高速なfocused UI iteration向けで一般問題整備適性が不明"
      - "既存36問benchmarkは画像入力とaudited scorerに既知欠陥がある"
      - "Codex App Serverのsubscription usageはAPI価格と同一ではない"
    existing_plan_facts:
      - "作業modelは下位候補、監査modelはSol"
      - "監査batchは最大5問"
      - "全LLM呼び出し1並列"
      - "柔道整復師を主サンプル、二級建築士を補助サンプルとする"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/question-maintenance-lower-cloud-model-benchmark/"
    command: "node /Users/yuki/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/question-maintenance-lower-cloud-model-benchmark"

