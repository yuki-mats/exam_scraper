  slug: "birukan-2018-2025-source-and-maintenance"
  kind: specific
  tranche: "8年度分を完全取得し、各問題を整備・監査・公開前検査まで進める。Firestore本番書込みは別承認に分離する。"
  status: active
  oracle:
