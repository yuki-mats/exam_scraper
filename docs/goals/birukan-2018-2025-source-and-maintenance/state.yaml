    final_proof: "8年度分のsource manifest、全工程receipt、法令監査・category成果物、quality-gate/upload dry-run、独立評価receipt、00_source不変検査、mainとorigin/mainの同期"
  intake:
    original_request: "まず、https://birukan.kakomonn.com/ より、2018〜2025年の00_sourceを取得して整備してほしい。"
    interpreted_outcome: "birukan.kakomonn.comの2018〜2025年度過去問を全件取得し、source保護と各整備工程を完了して公開前検査まで到達する。"
    input_shape: specific
    audience: "Repasoでビル管理師を学習する受験者"
    authority: requested
    proof_type: artifact
    completion_proof: "8年度分の00_source全件、後工程成果物、カテゴリ、法令監査、quality-gate、upload-readyの検査結果が証跡とともに揃うこと"
    likely_misfire: "部分取得・重複・未評価問題を整備完了と扱うこと"
    blind_spots_considered:
      - "00_source不変性と取得元更新の境界"
      - "canonical identityの重複・欠落"
      - "画像参照とtrue_false以外の問題形式"
      - "出題当時法と現行法の差"
      - "category/questionSetIdとFirestore公開境界"
      - "既存の他資格未コミット変更"
    existing_plan_facts:
      - "対象URLはhttps://birukan.kakomonn.com/"
      - "対象年度は2018〜2025"
      - "取得先はoutput/birukan/questions_json/<list_group_id>/00_source"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
