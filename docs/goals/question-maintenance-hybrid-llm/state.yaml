version: 2

goal:
  title: "問題整備システムのハイブリッドLLM化"
  slug: "question-maintenance-hybrid-llm"
  kind: existing_plan
  tranche: "一つのLLM切替pipelineを実装し、Codex単独とローカル生成・Codex監査を実動検証する"
  status: active
  oracle:
    signal: "固定代表問題集合で codex_only と local_generate_codex_audit が安全・品質・再開・batch監査の受入基準を満たす"
    cadence: "after each Worker package and at final audit"
    final_proof: "実run manifest、問題別receipt、比較表、対象回帰、00_source不変、Firestore write 0、scoped Git readback"
  intake:
    original_request: "複雑化を避けてハイブリッドLLM化を計画し、Codex App Serverのみの構成も選べるように実装・実動テストする"
    interpreted_outcome: "役割ごとのLLMと三つの処理上限を設定で交換できる一つの問題整備pipelineが、初期値1と一問安全境界を守り、将来の並列拡張を妨げず、ローカル生成・クラウド監査で公開可能品質へ収束する"
    input_shape: existing_plan
    audience: "問題整備システムの運用者と受験者"
    authority: approved
    proof_type: test
    completion_proof: "Codex単独とローカル生成・Codex監査の実runが受入基準を満たし、最終監査が full_outcome_complete: true を記録する"
    likely_misfire: "provider別workflowを作る、batchを一括合否にする、検査を緩める、又はモック成功だけで完了する"
    blind_spots_considered:
      - "未コミット変更と実行中run"
      - "旧runのreadbackとresume互換"
      - "secretと課金境界"
      - "batch部分失敗とstateHash"
      - "法令・画像・計算・大きいprompt"
      - "fallback常用によるローカル化の実益不足"
    existing_plan_facts:
      - "初期運用と受入runはquestion_parallelism=1、llm_call_concurrency=1だが、設定から将来増やせる"
      - "audit_batch_questions初期値5はsemantic batch問数であり、問題又はLLM呼出しの並列数とは別軸"
      - "codex_onlyも同じprofile機構を使う"
      - "maintenanceとauditの二役だけを初期実装する"
      - "codex_app_serverとopenai_compatible_httpの二backendだけを初期実装する"
      - "cloud auditは同期micro-batchとし、問題別判定とreceiptを維持する"
      - "実装後は実local modelとCodex App Serverで比較runを行う"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/question-maintenance-hybrid-llm/"
    command: "node /Users/yuki/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/question-maintenance-hybrid-llm"

