    interpreted_outcome: "2018年の全230問を棚卸し一覧化し、1問ずつ目視確認しながら最新基準（形式10・意図15・正答23・解説21）で高品質に整備を完遂する。"
    input_shape: existing_plan
    audience: "柔道整復師国家試験の受験者と運用者"
    authority: requested
    proof_type: artifact
    completion_proof: "全230問が目視処理され、coverage checkを全件通過し、mainブランチに直接コミット・プッシュされること。"
    likely_misfire: "スクリプトによる一括自動置換、検証スクリプトのみでの形骸的完了。"
    blind_spots_considered:
      - "断片肢の否定設問におけるquestionIntentの統一適用"
      - "文化庁基準に基づく文頭結論（正しい。/間違い。）および自然な主語（法令名を主語にしない）"
      - "関係法規設問における正確な条文・制度根拠の紐付け"
    existing_plan_facts:
      - "会話・報告は日本語で行う。"
      - "変更時には作業内容と保存先を明示する。"
      - "スクリプトによる一括機械生成は禁止。既存ツールのみ活用。"
      - "1問ずつ問題文・全選択肢・公式解答を目視確認する。"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

