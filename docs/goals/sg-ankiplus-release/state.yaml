    cadence: "各工程確定時と最終監査時"
    final_proof: "各工程receiptと公開状態のreadback。公開済み確認後だけfull_outcome_complete=true。"
  intake:
    original_request: "情報セキュリティマネジメントの過去問を整備して、暗記プラスの情報セキュリティマネジメントアプリとして公開することを最終目標とします。"
    interpreted_outcome: "漏れなく正確に取得・整備した問題を使った専用アプリを公開する。"
    input_shape: "specific"
    audience: "情報セキュリティマネジメントの受験者"
    authority: "requested"
    proof_type: "artifact"
    completion_proof: "独立評価済み問題の公開readback、アプリ動作確認、ストア公開状態"
    likely_misfire: "取得又は審査提出だけでアプリ公開を完了と扱うこと。"
    blind_spots_considered:
      - "旧形式の午後本文・図表と複数選択"
      - "欠損sourceのID維持"
      - "現行試験と旧年度問題"
      - "アプリ識別子と既存dirty変更"
      - "iOSを最初の公開先と仮定し設定確認で確定"
    existing_plan_facts:
      - "取得元URLはhttps://www.sg-siken.com/sgkakomon.php"
      - "既存ツールを再利用し精査する"
      - "今回は定期実行を設定しない"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: "installed"
  worker: "installed"
  judge: "installed"

visual_board:
  selected: "local"
  local:
    status: "live"
    url: "http://goalbuddy.localhost:41737/sg-ankiplus-release/"
