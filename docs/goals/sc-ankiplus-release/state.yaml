# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "情報処理安全確保支援士の過去問整備と暗記プラス公開"
  slug: "sc-ankiplus-release"
  kind: specific # specific | open_ended | existing_plan | recovery | audit
  tranche: "指定500問の内容独立評価を固定基準で完了（全2000肢、画像68問、追加確認後合格355・要再整備候補145）。独立評価時の原本とpatch不変を確認済み。145候補を再整備し、必須92検査とSC原本99ファイル・対象外355問の不変を確認。第一次再評価は合格114問・追加再整備30問・ユーザー指示で公式原文保持の出題保留1問。残る30問の限定再整備と再評価を実行中。現行基準での正式評価、カテゴリ・問題集と公開は未完了。2009年春55問は取得元画像404の解決待ち。"
  status: active # active | blocked | done
  oracle:
    signal: "公開回・問題URL集合の全件一致、IPA正答照合、問題ごとの整備・独立評価、実機検証、App Store公開確認。"
    cadence: "after each Worker package and at final audit"
    final_proof: "全問の取得・独立評価receipt、データ反映readback、暗記プラス実機検証とApp Store公開readback。"
  intake:
    original_request: "情報処理安全確保支援士の過去問を整備して、暗記プラスのアプリとして公開することを最終目標とする。"
    interpreted_outcome: "支援士の過去問を正確に取得・整備・評価し、暗記プラスアプリとして公開する。"
    input_shape: specific # vague | specific | existing_plan | recovery | audit
    audience: 支援士の受験者
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: artifact # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "整備・評価済み問題が公開アプリで学習できることを実機操作と公開状態のreadbackで確認する。"
    likely_misfire: "取得成功又はアプリのビルド成功だけで整備・公開を完了扱いする。"
    blind_spots_considered:
      - 午前選択式と午後記述式の学習方式を区別する。
      - 新規アプリrelease設定・公開scopeを確定する。
      - データ公開とiOS提出の確認を分ける。
    existing_plan_facts:
      - 取得元はhttps://www.sc-siken.com/sckakomon.php。
      - 既存scraperを利用して全件精査し、再取得を安定させる。
      - 定期実行は今回は設定しない。

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # missing and bundled_not_installed use PM fallback; unknown requires one exact-role attempt before fallback.
  scout: installed
  worker: installed
  judge: installed

visual_board:
