    authority: requested
    proof_type: artifact
    completion_proof: "参照設計・現行03成果物・run終端・品質検証・Firestore非書込を一つの最終監査で確認する"
    likely_misfire: "共通promptをAWS例で肥大化する、分類だけ付けて文章構成へ反映しない、正答不整合を03で補正する、又はUIを経由せず完了扱いする"
