version: 2

goal:
  title: "一級・二級ボイラー技士の一問ずつ目視問題整備"
  slug: boiler-manual-question-maintenance
  kind: specific
  tranche: "未完工程を現物から確定し、各問題を一問ずつ目視で整備して、両資格の必要工程を完了する"
  status: active
  oracle:
    signal: "boiler1とboiler2の全対象問題について、未完工程の台帳と一問単位の目視整備receiptが対応し、00_source不変のまま公式workflowの完了条件を満たす"
    cadence: "各問題の目視整備後と最終監査時"
    final_proof: "全対象IDの工程完了対応、目視根拠、00_source不変、公式workflow完了条件を示す最終監査receipt"
  intake:
    original_request: "一級ボイラー、二級ボイラーの未整備工程を洗い出し、機械的な作業をせず、一問ずつ目視で整備する"
    interpreted_outcome: "boiler1とboiler2の未完工程を現物で確定し、内容判断と修正を必ず一問ずつ目視で行って全対象を完了させる"
    input_shape: specific
    audience: "資格試験の受験者と問題整備担当者"
    authority: requested
    proof_type: review
    completion_proof: "両資格の全対象問題に一問単位の目視receiptがあり、未完工程が残らず、00_source不変と公式完了条件を確認できる"
    likely_misfire: "自動生成や一括補正で見かけの進捗だけを埋める、または一部の問題だけで全体完了とする"
    blind_spots_considered:
      - "既存runの進捗率やファイル件数だけでは完了を判定できない"
      - "問題由来・法令根拠・解説品質は別々に確定する必要がある"
      - "二級ボイラーには39問の回があり、欠問調査と問題整備を混同しない"
    existing_plan_facts:
      - "対象資格はboiler1とboiler2"
      - "未完工程を先に洗い出す"
      - "内容の確認と整備は一問ずつ目視で行う"
      - "機械的な生成・一括補正・自動レビューを行わない"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/boiler-manual-question-maintenance/"
    command: "node /Users/yuki/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/boiler-manual-question-maintenance"

