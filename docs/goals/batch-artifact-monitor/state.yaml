# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "バッチ成果物モニターと安定イベントAPI"
  slug: "batch-artifact-monitor"
  kind: existing_plan
  tranche: "既存変更を保護し、安定イベントAPIとread-onlyモニターを実装・検証・公開する"
  status: active
  oracle:
    signal: "現行問題整備Python server配下の実runを使い、並列thread、保存済み成果物、Agent発言、公開推論サマリー、活動イベントをリアルタイム表示でき、モニター起因のmodel requestが0であることを自動試験とブラウザwalkthroughで確認できる"
    cadence: "after each Worker package and at final audit"
    final_proof: "対象テスト、64並列相当の負荷・再接続試験、ブラウザwalkthrough、artifact readback、monitorModelRequests=0、mainへのcommit/push"
  intake:
    original_request: "API基盤もあるべき姿に整備し、バッチ成果物モニターを構築してほしい"
    interpreted_outcome: "現行問題整備Python serverが管理する単一Codex App Serverを安全に観測できる、安定したread-onlyイベントAPIと成果物中心のリアルタイムモニターを完成させる"
    input_shape: existing_plan
    audience: "問題整備バッチの運用者"
    authority: approved
    proof_type: demo
    completion_proof: "実run又は忠実なfixtureで全主要表示と再接続を確認し、監視有無でmodel開始RPCとtoken usageが増えず、全対象テストが成功する"
    likely_misfire: "汎用トレース画面又は操作可能なAgent管理画面を作り、保存済み成果物の確認、read-only境界、既存artifact正本を損なう"
    blind_spots_considered:
      - "raw reasoning、system/developer instruction、secret、無加工tool出力を漏らさない"
      - "監視queue、disk、browserの障害で整備runを止めない"
      - "App Server再起動時のevent gapを推測で埋めない"
      - "既存の未コミット変更と今回の変更を混ぜない"
      - "Codex Desktop全体ではなく、指定された単一App Serverだけを初期対象とする"
    existing_plan_facts:
      - "問題整備システムとモニターは別UI・別責務とする"
      - "初期は同じPython backendと単一App Server接続ownerを共有する"
      - "monitor-event/v1を自前の安定契約とする"
      - "Agent発言と公開推論サマリーを表示し、非公開の内部推論は扱わない"
      - "モニターからAgentへ指示せず、追加model tokenを消費しない"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/batch-artifact-monitor/"
    command: "node /Users/yuki/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/batch-artifact-monitor"

