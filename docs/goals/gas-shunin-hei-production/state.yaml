        - path: output/gas-shunin-hei/questions_json/*/30_merged_2/*.json
          finding: 27ファイル・522原問。questionSetId、explanationText、explanationTextList、isLawRelated、lawRevisionFactsの非空件数はすべて0。存在するpatch層は10が27、15が14、24が289。18・21・22・23は未作成。
        - path: config/qualification_rules.json
          finding: 丙種個別設定なし。default.law_workflow_enabled=trueが適用される。乙種もtrue。
        - path: config/question_maintenance_workflow.toml
          finding: 標準stage IDsはquestion_type、question_intent、correct_choice、law_context、explanation、law_audit、category_setup、question_set。04のquestion_set.question_setがquestionSetIdを所有し、22_questionSetId_linkedへ保存する。
        - path: tools/question_review_console/server.py:961
          finding: 整備POST /api/qualification-runs/preview と /start。qualification、stageIds、listGroupIds、updateTargetIds、questionIds、mode、questionConcurrency、speedMode、previewToken、modelProfile等を受理。preview/startを同一scopeとtokenへ固定する。
        - path: scripts/pipeline/continue_knoun_maintenance.py:29
          finding: 既存Console実装はGET /api/sessionのsessionTokenをメモリだけで受け、POSTにX-Review-SessionとOriginを付与する。tokenを成果物へ保存しない。進捗GET
            /api/qualification-runs/<runId>/progress?qualification=...。
        - path: tools/question_review_console/server.py:1206
          finding: 評価POST /api/evaluations/preview と /start。questionIds指定又はcontinuousQueue=true＋qualification/listGroupIdで標準評価対象を選定。previewTokenで現在内容へ束縛。
        - path: tools/question_review_console/server.py:1158
          finding: 公開POST /api/publications/preview と /start。1〜100原問questionIds、同じpreviewToken、confirmedProduction=trueが必要。repository排他queueが一問ずつ処理し直後readbackを保存する。
        - path: document/operations/delivery_workflow.md
          finding: 公開条件は適用工程の現行MAJOR、現在内容に対する現行MAJOR別session評価、merge/convert/upload
            dry-run成功、source不変。未解決の全肢根拠・正答・解説・法令監査があれば公開不可。
        - path: tools/question_review_console/server.py:1112
          finding: 資格全体の標準readback入口は/api/firestore-readback/preview。tools/question_review_console/bulk_readback.pyが全対象IDを400件ずつ読み、公開予定fieldと本番値を比較する。
        - path: output/gas-shunin-otsu/category/category.json
          finding: 乙種ローカルは6 folders・119 questionSets。metadata.source=firestore。ローカルfolder.qualificationIdは旧chiefgasengineerlicenseで、本番のgas-shunin-otsuと相違するため、そのまま複製しない。
        - path: prompt/qualification_docs/shared_taxonomy_mapping_policy.md
          finding: 科目をcanonical taxonomy、甲乙丙をqualificationとして分離し、Firestore IDは資格区分ごとにmaterializeする。既存IDがあれば維持。乙種B系IDを丙種へ共有せず、canonical参照を補助情報として保持できる。
        - source: Firestore live read-only queries / project repaso-rbaqy4
          finding: gas-shunin-hei qualificationIdのfolders/questionSets/questionsは各0。licenseName=ガス主任技術者のfoldersは14件で甲8・乙6、C系なし。現本番乙種folderのqualificationIdはgas-shunin-otsu。主担当も独立取得したraw
            snapshotを保持済み。
      facts:
        - config/scrape_presets.jsonの丙種正式表示名はガス主任技術者丙種、取得年度2017〜2025、各58原問。
        - 確認時のPython listener8780/8781はRepaso previewで、整備consoleではなかった。主担当が8790で標準console起動中。
        - 正式work versionはoutput/question_review_console/<qualification>/<group>/work_versions/<identityHash>.json、正式評価projectionは同scopeのevaluations/<identityHash>.json。旧PDF独立監査だけでこれらを代替しない。
